<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  #root { font-family: var(--kimi-font-sans); padding-block-start: var(--kimi-space-4); padding-inline: var(--kimi-space-4); width: 100%; }
  button, input, select, textarea { font: inherit; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: var(--kimi-space-3); }
  .date { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--kimi-space-3); margin-block-start: var(--kimi-space-3); }
  .cell { border: 0.5px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel); padding: var(--kimi-space-3); }
  .cell .label { font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .cell .main { font-size: 28px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; margin-block-start: 2px; }
  .cell .sub { font-size: 12px; color: var(--kimi-color-text-tertiary); font-variant-numeric: tabular-nums; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-block-start: var(--kimi-space-3); }
  .note { font-size: 12px; color: var(--kimi-color-text-tertiary); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root">
  <div class="head">
    <span class="date" id="date">—</span>
    <span class="kimi-status" id="status">等待数据</span>
  </div>
  <div class="grid">
    <div class="cell">
      <div class="label">1 分钟行情</div>
      <div class="main" id="m1rows">—</div>
      <div class="sub" id="m1sub"></div>
    </div>
    <div class="cell">
      <div class="label">集合竞价</div>
      <div class="main" id="aucrows">—</div>
      <div class="sub" id="ausub"></div>
    </div>
  </div>
  <div class="foot">
    <span class="note" id="note"></span>
    <span class="note" id="elapsed"></span>
  </div>
</div>
<script>
(function () {
  var d = window.DaimonWidget;
  if (!d) return;
  function fmt(n) { return (n == null) ? "—" : Number(n).toLocaleString("zh-CN"); }
  function render(data) {
    if (!data) return;
    document.getElementById("date").textContent = data.tradeDate || "—";
    document.getElementById("m1rows").textContent = fmt(data.m1 && data.m1.rows);
    document.getElementById("m1sub").textContent = "新载 " + fmt(data.m1 && data.m1.loaded) + " 只 · 跳过 " + fmt(data.m1 && data.m1.skip);
    document.getElementById("aucrows").textContent = fmt(data.auction && data.auction.rows);
    document.getElementById("ausub").textContent = "新载 " + fmt(data.auction && data.auction.loaded) + " 只 · 跳过 " + fmt(data.auction && data.auction.skip);
    document.getElementById("note").textContent = data.note || "";
    document.getElementById("elapsed").textContent =
      "库容 1min " + fmt(data.dbM1Rows) + " · 竞价 " + fmt(data.dbAuctionRows) +
      " ｜ 耗时 " + (data.elapsedS != null ? data.elapsedS + "s" : "—");
    var st = document.getElementById("status");
    if (data.nFail > 0) { st.className = "kimi-status kimi-status--warning"; st.textContent = data.nFail + " 只失败"; }
    else if ((data.m1 && data.m1.rows > 0) || (data.auction && data.auction.rows > 0)) { st.className = "kimi-status kimi-status--positive"; st.textContent = "已入库"; }
    else if ((data.dbM1Rows || 0) > 0) { st.className = "kimi-status kimi-status--positive"; st.textContent = "在库（今日幂等跳过）"; }
    else { st.className = "kimi-status"; st.textContent = "无新数据"; }
  }
  const pick = function (m) { return (m && m.hf) ? ((m.hf.ok && m.hf.artifact) || {summary: "分钟自录阶段失败：" + ((m.hf || {}).error || "?")}) : m; };
  render(pick(d.data && d.data.main));
  var off = d.onDataChange(function (snap) { render(pick(snap && snap.main)); });
  if (typeof off === "function") { /* 保留订阅 */ }
})();
</script>
</body>
</html>
