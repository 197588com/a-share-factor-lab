  .cell { width: 44px; height: 22px; border-radius: 3px; font-size: 10px;

    color: var(--kimi-color-text-secondary); cursor: default; }

  .dt { margin-block-start: var(--kimi-space-3); border-block-start: 0.5px solid var(--kimi-color-border); padding-block-start: var(--kimi-space-3); }
  .dt h3 { font-size: 14px; font-weight: 500; margin-block-end: var(--kimi-space-2); }
  .dt h3 span { font-weight: 400; color: var(--kimi-color-text-tertiary); font-size: 12px; margin-inline-start: var(--kimi-space-2); }

  .rows .track { height: 10px; position: relative; background: var(--kimi-color-surface-muted); border-radius: var(--kimi-radius-full); }

  .note { font-size: 12px; color: var(--kimi-color-text-quaternary); margin-block-start: var(--kimi-space-3); }

    const wa = Math.round(Math.abs(r.a || 0) / m * 100), wb = Math.round(Math.abs(r.b || 0) / m * 100);
    h += '<div class="fn">' + r.f + '</div><div class="track">' +
      '<i class="a" style="width:' + wa + '%"></i><i class="b" style="width:' + wb + '%;opacity:.85"></i></div>' +
      '<div class="v">' + (r.a === null ? '—' : r.a.toFixed(3)) + '</div><div class="v">' + r.b.toFixed(3) + '</div>';
  });
  dt.innerHTML = h + '</div>';
  document.querySelectorAll('.hm td.fam').forEach(td => td.classList.remove('sel'));
  document.getElementById('fam-' + i).classList.add('sel');
  sel = i;
}
hm.addEventListener('click', e => {
  const td = e.target.closest('td.fam');
  if (td) showDetail(+td.dataset.i);
});
showDetail(DATA.families.findIndex(f => f.name === 'ma'));
</script>
</body>
</html>
